<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulatore CCNA</title>
    <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; max-width: 800px; margin: auto; padding: 20px; background: #f4f4f4; }
    #quiz-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

    </style>
</head>
<body>

    <h1 id="mod-title">Caricamento in corso...</h1>
    
    <div id="quiz-container">
        <p id="question">Caricamento domanda...</p>
        <div id="options"></div>
        <div id="feedback"></div>
    </div>

    <script src="ccna1_data.js"></script>
    <script src="ccna2_data.js"></script>
    <script src="ccna3_data.js"></script>
    
    <script src="quiz.js"></script>
